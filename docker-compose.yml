services:
  rag-streamlit:
    build: .
    container_name: rag-streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
      - hf_cache_volume:/root/.cache/huggingface
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
  # ollama_storage:
  hf_cache_volume: